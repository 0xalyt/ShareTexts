name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VITE_CI_LOCAL_WORKER: '1'
      VITE_SIGNALING_URL: http://localhost:8787
      WRANGLER_SEND_METRICS: 'false'
    # P6: the core flow has to hold in all three engines. Chromium is the fast
    # path people actually use; WebKit is iPhone Safari; Firefox is the one
    # engine with different flexbox, focus and backdrop-filter behaviour.
    strategy:
      fail-fast: false
      matrix:
        browsers: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck client
        run: npm run lint

      - name: Typecheck worker
        run: npm run worker:typecheck

      - name: Block production signaling
        run: |
          echo '0.0.0.0 sharetext-signaling.alighttt.workers.dev' | sudo tee -a /etc/hosts
          if curl --noproxy '*' -fsS --connect-timeout 3 --max-time 5 https://sharetext-signaling.alighttt.workers.dev/health; then
            echo 'Production signaling must be unreachable'
            exit 1
          fi
          test "$(getent ahostsv4 sharetext-signaling.alighttt.workers.dev | head -1 | cut -d' ' -f1)" = '0.0.0.0'

      - name: Worker protocol suite (emulator)
        run: npm run worker:test && node scripts/verify-worker-endpoint.mjs

      - name: Build
        run: npm run build

      - name: Start local signaling Worker
        run: node scripts/start-ci-worker.mjs

      - name: Space double-join request stream regression
        if: matrix.browsers == 'chromium'
        run: node scripts/verify-space-join-stream.mjs

      - name: Space live updates after idle
        if: matrix.browsers == 'chromium'
        run: node scripts/verify-space-idle.mjs

      - name: Install Playwright browsers
        # The composer geometry gate launches Chromium in every matrix job.
        run: npx playwright install --with-deps chromium ${{ matrix.browsers }}

      - name: Start server
        run: |
          PORT=3311 nohup npm run start > /tmp/sharetext-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3311/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "server failed to start"
          tail -40 /tmp/sharetext-server.log
          exit 1

      # Exercise the built app with the in-job Worker, never production.
      - name: Nested overlay focus regression
        run: BROWSER=${{ matrix.browsers }} BASE_URL=http://localhost:3311 node scripts/verify-overlay-focus.mjs

      - name: Keyboard and pointer reaction regression
        if: matrix.browsers == 'chromium'
        run: URL=http://localhost:3311 npm run test:reactions

      - name: Motion and reduced-motion contracts
        run: BROWSERS=${{ matrix.browsers }} node scripts/verify-motion-contracts.mjs

      # P7: the P4 composer incident, as a rectangle check. Text-level gates
      # cannot see a Send circle that walks 65px up a grown row.
      - name: Verify local signaling in built app
        run: BROWSER=${{ matrix.browsers }} URL=http://localhost:3311 node scripts/verify-ci-worker.mjs

      - name: Nearby opt-in lifecycle
        if: matrix.browsers == 'chromium'
        run: BASE_URL=http://localhost:3311 node scripts/verify-nearby-optin.mjs

      - name: Nearby invite acceptance and two-way room
        if: matrix.browsers != 'webkit'
        run: BROWSER=${{ matrix.browsers }} BASE_URL=http://localhost:3311 node scripts/verify-nearby-accept.mjs

      - name: Composer geometry gate
        run: URL=http://localhost:3311 node scripts/verify-composer.mjs

      - name: Landing handoff and audit regressions
        run: BROWSER=${{ matrix.browsers }} BASE_URL=http://localhost:3311 node scripts/verify-handoff.mjs

      - name: Browser E2E (create → join → transfer → reconnect → rejoin)
        id: browser_e2e
        # Handoff opens dozens of contexts on one loopback IP, exhausting the
        # Worker's per-IP socket budget. Reset volatile limits, not production defaults.
        run: |
          node scripts/start-ci-worker.mjs --restart
          BROWSER=${{ matrix.browsers }} URL=http://localhost:3311 node scripts/e2e.mjs

      - name: Three-device encrypted relay files
        run: |
          node scripts/start-ci-worker.mjs --restart
          BROWSER=${{ matrix.browsers }} URL=http://localhost:3311 node scripts/verify-relay-files.mjs

      - name: Screenshots (this engine)
        run: BROWSER=${{ matrix.browsers }} URL=http://localhost:3311 node scripts/capture-matrix.mjs
        continue-on-error: true

      - name: Worker diagnostics on failure
        if: failure()
        run: |
          if [ -f audit/worker.log ]; then cat audit/worker.log; fi
          for log in "$HOME"/.config/.wrangler/logs/*.log; do
            if [ -f "$log" ]; then
              echo "--- $log ---"
              cat "$log"
            fi
          done

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.browsers }}
          path: audit/
          if-no-files-found: ignore

      - name: Layout / accessibility audit
        run: URL=http://localhost:3311 node scripts/audit.mjs
        continue-on-error: true
