name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # P6: the core flow has to hold in all three engines. Chromium is the fast
    # path people actually use; WebKit is iPhone Safari; Firefox is the one
    # engine with different flexbox, focus and backdrop-filter behaviour.
    strategy:
      fail-fast: false
      matrix:
        browsers: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck client
        run: npm run lint

      - name: Typecheck worker
        run: npm run worker:typecheck

      - name: Worker protocol suite (emulator)
        run: npm run worker:test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browsers }}

      - name: Start server
        run: |
          PORT=3311 nohup npm run start > /tmp/sharetext-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3311/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "server failed to start"
          tail -40 /tmp/sharetext-server.log
          exit 1

      - name: Browser E2E (create → join → transfer → reconnect → rejoin)
        run: BROWSER=${{ matrix.browsers }} URL=http://localhost:3311 node scripts/e2e.mjs

      - name: Screenshots (this engine)
        run: BROWSER=${{ matrix.browsers }} URL=http://localhost:3311 node scripts/capture-matrix.mjs
        continue-on-error: true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.browsers }}
          path: audit/
          if-no-files-found: ignore

      - name: Layout / accessibility audit
        run: URL=http://localhost:3311 node scripts/audit.mjs
        continue-on-error: true
