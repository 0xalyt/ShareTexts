name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # P6: the core flow has to hold in all three engines. Chromium is the fast
    # path people actually use; WebKit is iPhone Safari; Firefox is the one
    # engine with different flexbox, focus and backdrop-filter behaviour.
    strategy:
      fail-fast: false
      matrix:
        browsers: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck client
        run: npm run lint

      - name: Typecheck worker
        run: npm run worker:typecheck

      - name: Worker protocol suite (emulator)
        run: npm run worker:test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        # The composer geometry gate launches Chromium in every matrix job.
        run: npx playwright install --with-deps chromium ${{ matrix.browsers }}

      - name: Start server
        run: |
          PORT=3311 nohup npm run start > /tmp/sharetext-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3311/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "server failed to start"
          tail -40 /tmp/sharetext-server.log
          exit 1

      # This keyboard regression is independent of signaling/room creation.
      # Use the normal local dev backend: WebKit exposes failing live stats
      # requests as page errors, which must not masquerade as a focus crash.
      - name: Nested overlay focus regression
        run: BROWSER=${{ matrix.browsers }} node scripts/verify-browser.mjs overlay-focus

      # P7: the P4 composer incident, as a rectangle check. Text-level gates
      # cannot see a Send circle that walks 65px up a grown row.
      - name: Composer geometry gate
        run: URL=http://localhost:3311 node scripts/verify-composer.mjs

      - name: Landing handoff and audit regressions
        run: BROWSER=${{ matrix.browsers }} BASE_URL=http://localhost:3311 node scripts/verify-handoff.mjs

      - name: Browser E2E (create → join → transfer → reconnect → rejoin)
        id: browser_e2e
        run: BROWSER=${{ matrix.browsers }} URL=http://localhost:3311 node scripts/e2e.mjs

      # A failed delivery must be compared with main on this exact runner,
      # not another provider/region. This control never changes the PR result.
      - name: Main control on the same failed WebKit runner
        if: ${{ failure() && steps.browser_e2e.outcome == 'failure' && matrix.browsers == 'webkit' && github.event_name == 'pull_request' }}
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          BASELINE_DIR="$RUNNER_TEMP/sharetexts-main-control"
          git fetch --depth=1 origin "$BASELINE_REF"
          git worktree add --detach "$BASELINE_DIR" FETCH_HEAD
          npm ci --prefix "$BASELINE_DIR"
          npm run build --prefix "$BASELINE_DIR"
          PORT=3312 npm run start --prefix "$BASELINE_DIR" > "$RUNNER_TEMP/sharetexts-main-control-server.log" 2>&1 &
          ready=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3312/health > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/sharetexts-main-control-server.log"
            exit 1
          fi
          BROWSER=webkit URL=http://localhost:3312 node scripts/e2e.mjs

      - name: Screenshots (this engine)
        run: BROWSER=${{ matrix.browsers }} URL=http://localhost:3311 node scripts/capture-matrix.mjs
        continue-on-error: true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.browsers }}
          path: audit/
          if-no-files-found: ignore

      - name: Layout / accessibility audit
        run: URL=http://localhost:3311 node scripts/audit.mjs
        continue-on-error: true
