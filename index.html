<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <!-- Primary -->

    <!-- Vite supplies theme-specific posters from the player's asset source.
         The existing theme bootstrap preloads only the one actually shown. -->

    <meta name="author" content="ShareTexts" />
    <meta name="application-name" content="ShareTexts" />

    <!-- First-paint canvas: the app's CSS arrives via JS (Vite injects it),
         so until main.tsx runs the browser paints with UA defaults — which
         framed the cream boot shell in an 8px WHITE border (default body
         margin on a white canvas). Pin the page field here, in head, so the
         very first painted pixel is already the app's canvas, light or dark. -->
    <style>
      html, body { margin: 0; background: #fbfbfd; }
      html.dark, html.dark body { background: #181818; }
    </style>

    <!-- One efficient Allo cut for text and display, shared with static pages. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/allo-crisp.woff2" crossorigin />
    <link rel="stylesheet" href="/typography.css" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShareTexts" />

    <!-- Open Graph — every social surface reads THIS block (X, WhatsApp,
         LinkedIn, Slack, Discord, iMessage, Telegram). The image is the
         owner's app tile and nothing else, edge to edge: the artwork IS the
         card. v1 floated that tile on a white field, which at feed size read
         as an empty white rectangle — the "shared links look broken" report
         again — so v2 fills the frame with the tile's own gradient and a large
         mark. Still no headline, no lockup, no UI sketch.
         ?v= + a NEW file name bust the caches: platforms key the preview on
         the URL, so the same path would keep serving the retired card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShareTexts" />
    <meta property="og:title" content="ShareTexts: Airdrop for everyone" />
    <meta property="og:description" content="Send text, links, photos, videos and files between devices in your browser. No app or account. Use a room to send now, or a Temporary Space for text and links later." />
    <meta property="og:url" content="https://sharetexts.online/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://sharetexts.online/og/sharetext-og-icon-v6.jpg" />
    <meta property="og:image:secure_url" content="https://sharetexts.online/og/sharetext-og-icon-v6.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="ShareTexts — the app icon: the white signal mark on an orange gradient tile, centred on a white card." />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@0xalyt" />
    <meta name="twitter:creator" content="@0xalyt" />
    <meta name="twitter:title" content="ShareTexts: Airdrop for everyone" />
    <meta name="twitter:description" content="Send text, links, photos, videos and files between devices in your browser. No app or account. Use a room to send now, or a Temporary Space for text and links later." />
    <meta name="twitter:image" content="https://sharetexts.online/og/sharetext-og-icon-v6.jpg" />
    <meta name="twitter:image:src" content="https://sharetexts.online/og/sharetext-og-icon-v6.jpg" />
    <meta name="twitter:image:width" content="1200" />
    <meta name="twitter:image:height" content="630" />
    <meta name="twitter:image:alt" content="ShareTexts — the app icon: the white signal mark on an orange gradient tile, centred on a white card." />

    <link rel="canonical" href="https://sharetexts.online/" />
    <link rel="alternate" hreflang="x-default" href="https://sharetexts.online/" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <!-- /favicon.ico FIRST: crawlers, bookmark bars and OS shortcuts probe
         this URL by default; a 404 here is the usual reason a site's icon
         never appears in search results. Generated from the same artwork by
         scripts/gen-favicon-ico.mjs, so it can never drift from the PNGs. -->
    <link rel="icon" href="/favicon.ico?v=22" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=21" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=21" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=21" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=21" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=21" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=21" />

    <!-- Structured data: Organization + WebApplication graph. One graph,
         stable @ids; HowTo/FAQPage JSON-LD lives only on pages whose visible
         content actually matches it (/docs serves the FAQ both pre- and
         post-hydration; Google retired HowTo rich results in 2023, so no
         HowTo block is shipped where its steps can't stay visible). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://sharetexts.online/#organization",
          "name": "ShareTexts",
          "url": "https://sharetexts.online/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://sharetexts.online/icon-512.png?v=21",
            "width": 512,
            "height": 512
          },
          "sameAs": [
            "https://x.com/0xalyt"
          ]
        },
        {
          "@type": "WebApplication",
          "@id": "https://sharetexts.online/#application",
          "name": "ShareTexts",
          "alternateName": "ShareTexts",
          "url": "https://sharetexts.online/",
          "description": "Move text, links, photos, and files between any two devices. No app, no account. Pair, send, done. Live rooms for handoffs. Temporary Spaces store text and links for later.",
          "applicationCategory": "UtilitiesApplication",
          "operatingSystem": "Any modern browser with WebRTC support",
          "browserRequirements": "Requires a supported browser and an internet connection",
          "isAccessibleForFree": true,
          "inLanguage": "en",
          "image": "https://sharetexts.online/og/sharetext-og-icon-v6.jpg",
          "screenshot": "https://sharetexts.online/og/sharetext-og-icon-v6.jpg",
          "featureList": [
            "Nearby device discovery that you turn on for 10 minutes",
            "Six-digit live pairing code",
            "QR code pairing",
            "Shareable room links",
            "Transfer text, links, photos, videos, audio, and any file",
            "Encrypted peer-to-peer transfers",
            "Works between iPhone, Android, Windows, macOS, and Linux"
          ],
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "publisher": {
            "@id": "https://sharetexts.online/#organization"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://sharetexts.online/#website",
          "url": "https://sharetexts.online/",
          "name": "ShareTexts",
          "publisher": { "@id": "https://sharetexts.online/#organization" },
          "inLanguage": "en"
        }
      ]
    }
    </script>
    <!-- Apply the saved theme before first paint (no flash): default to the
         system preference; a manual choice in localStorage wins. The same
         logic lives in src/lib/theme.ts for runtime changes. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('sharetext.theme');
          var dark = v === 'dark' || (v !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? '#181818' : '#fbfbfd';
        } catch (e) {
          document.documentElement.classList.toggle('dark', matchMedia('(prefers-color-scheme: dark)').matches);
        }
        // Run before React, after resolving the saved theme. Static media
        // preloads alone follow the OS and waste the opposite poster when a
        // visitor saved an override. Metadata comes from heroFilmAssets.
        try {
          var film = document.querySelector('meta[name="hero-film-posters"]');
          if (film) {
            var picture = document.createElement('link');
            picture.rel = 'preload'; picture.as = 'image';
            picture.setAttribute('fetchpriority', 'high');
            var filmViewport = matchMedia(film.getAttribute('data-phone-media'));
            var syncFilmPoster = function () {
              var theme = document.documentElement.classList.contains('dark') ? 'data-dark' : 'data-light';
              var poster = film.getAttribute(theme + (filmViewport.matches ? '-mobile' : ''));
              if (picture.getAttribute('href') !== poster) picture.setAttribute('href', poster);
            };
            syncFilmPoster(); document.head.appendChild(picture);
            new MutationObserver(syncFilmPoster).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
            filmViewport.addEventListener('change', syncFilmPoster);
          }
        } catch (e) { /* a preload must never block app boot */ }
        // A tab that reloads inside a linked room boots straight back into
        // it, so the placeholder must be room-shaped: a landing skeleton
        // there is a screen the user never asked for. Same test as
        // storedRoomWasLinked() in src/lib/session/persistence.ts.
        try {
          var s = location.pathname === '/' && JSON.parse(localStorage.getItem('sharetext.session.v1') || 'null');
          if (s && s.roomId && (s.partnerName || (s.messages && s.messages.length))) document.documentElement.classList.add('st-resume');
        } catch (e) { /* no stored room — the landing skeleton is right */ }
        // Slow-boot honesty (mirrors the in-app connecting screen): an 8s boot
        // is NOT normal — say so instead of shimmering forever. Folded into
        // this whitelisted script so the strict CSP keeps exactly ONE inline
        // script (the old second inline block violated script-src by hash).
        try {
          setTimeout(function () {
            var el = document.getElementById('st-boot-slow');
            if (el && document.getElementById('loading-shell')) el.style.display = 'block';
          }, 8000);
        } catch (e) { /* never block boot */ }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Boot screen: ONE quiet mark, one hairline progress, one line of
           text — the product holding your place while its code arrives.
           The old shell drew a full faux landing page (headline, fake Send
           buttons, a how-it-works list and ten FAQ answers) as grey bars, so
           the first thing anyone saw was a wireframe of a website: slop.
           A loader's only job is to say "coming, and it's ShareTexts".
           The crawlable copy did not disappear with it — it moved into the
           <noscript> block below, where it serves crawlers and no-JS
           visitors without ever being shown to a browser that can run the
           app. -->
      <div id="loading-shell">
        <style>
          #loading-shell {
            min-height: 100dvh;
            display: block;
            background: #fbfbfd;
            font-family: var(--st-font-sans);
            transition: opacity 0.22s cubic-bezier(0.22, 1, 0.36, 1);
          }
          #loading-shell.fade-out { opacity: 0; }
          html.dark #loading-shell { background: #181818; }
          /* SKELETON, not a splash. It draws the page that is about to
             arrive — the same grid, the same column split, the same radii —
             so hydration replaces blocks in place instead of swapping one
             layout for another. Nothing here fetches an image: the first
             paint costs zero network requests beyond the document itself.
             Radii mirror the real components (film 10, buttons 14, field
             pill) because a skeleton with made-up corners is a second design
             the user has to un-see. */
          #loading-shell .st-skel {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 24px 56px;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 28px;
            align-items: start;
          }
          @media (min-width: 1024px) {
            #loading-shell .st-skel {
              grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
              gap: 40px;
              padding-top: 30px;
            }
          }
          #loading-shell .st-sk {
            position: relative;
            overflow: hidden;
            background: rgba(20, 16, 10, 0.075);
            border-radius: 10px;
          }
          html.dark #loading-shell .st-sk { background: rgba(255, 255, 255, 0.08); }
          #loading-shell .st-sk::after {
            content: '';
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            animation: st-sk-shimmer 1.45s cubic-bezier(0.4, 0, 0.6, 1) infinite;
          }
          html.dark #loading-shell .st-sk::after {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.07), transparent);
          }
          @keyframes st-sk-shimmer { 100% { transform: translateX(100%); } }
          #loading-shell .st-sk--pill { height: 28px; width: min(220px, 70%); border-radius: 999px; }
          #loading-shell .st-sk--h1 { height: 32px; margin-top: 18px; }
          #loading-shell .st-sk--line { height: 14px; margin-top: 12px; }
          #loading-shell .st-sk--track { height: 12px; width: 150px; margin-top: 22px; border-radius: 999px; }
          #loading-shell .st-sk--btn { height: 52px; border-radius: 14px; }
          #loading-shell .st-sk--field { height: 52px; margin-top: 12px; border-radius: 999px; }
          #loading-shell .st-sk--film { margin-top: 20px; border-radius: 10px; aspect-ratio: 16 / 9; }
          #loading-shell .st-skel__btns { display: grid; gap: 12px; margin-top: 22px; grid-template-columns: 1fr; }
          @media (min-width: 420px) {
            #loading-shell .st-skel__btns { grid-template-columns: 1fr 1fr; }
          }
          @media (min-width: 640px) { #loading-shell .st-sk--h1 { height: 42px; } }
          /* The film is a column of its own on desktop and an inline block on
             phones — exactly like the hero it is standing in for. */
          #loading-shell .st-skel__film--inline { display: block; }
          #loading-shell .st-skel__film--side { display: none; }
          @media (min-width: 1024px) {
            #loading-shell .st-skel__film--inline { display: none; }
            #loading-shell .st-skel__film--side { display: block; }
          }
          #loading-shell .st-note {
            margin: 14px 0 0;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.5;
            color: #6e6e73;
            letter-spacing: -0.01em;
          }
          html.dark #loading-shell .st-note { color: rgba(255, 255, 255, 0.55); }
          @media (prefers-reduced-motion: reduce) {
            #loading-shell .st-sk::after { animation: none; opacity: 0; }
          }
          /* Room resume: the same three regions as SkeletonScreen's room
             variant (device bar, message column, composer), so shell →
             skeleton → room replaces blocks in place. */
          #loading-shell .st-skel-room { display: none; height: 100dvh; flex-direction: column; }
          html.st-resume #loading-shell .st-skel { display: none; }
          html.st-resume #loading-shell .st-skel-room { display: flex; }
          #loading-shell .st-skel-room__bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
          #loading-shell .st-skel-room__list { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 0 16px 16px; }
          #loading-shell .st-skel-room__composer { display: flex; align-items: center; gap: 8px; padding: 0 16px 20px; }
          #st-boot-slow {
            margin: 0; max-width: 34ch; text-align: center;
            font-size: 12.5px; font-weight: 500; line-height: 1.5; color: #6e6e73;
          }
        </style>

        <div class="st-skel" aria-hidden="true">
          <div>
            <div class="st-sk st-sk--pill"></div>
            <div class="st-sk st-sk--h1" style="width: 92%"></div>
            <div class="st-sk st-sk--h1" style="width: 74%; margin-top: 10px"></div>
            <div class="st-skel__film--inline">
              <div class="st-sk st-sk--film"></div>
            </div>
            <div class="st-sk st-sk--track"></div>
            <div class="st-skel__btns">
              <div class="st-sk st-sk--btn"></div>
              <div class="st-sk st-sk--btn"></div>
            </div>
            <div class="st-sk st-sk--line" style="width: 86%; margin-top: 18px"></div>
            <div class="st-sk st-sk--line" style="width: 64%"></div>
            <div class="st-sk st-sk--field"></div>
            <!-- The honest escalation (mirrors the in-app connecting screen):
                 an 8s boot is NOT normal — say so instead of shimmering
                 forever. Kept outside the aria-hidden skeleton so a slow
                 boot still announces something to a screen reader. -->
            <p id="st-boot-slow" style="display:none">
              Still loading — your connection is slow. If this doesn't clear, check your network and refresh.
            </p>
          </div>
          <div class="st-skel__film--side">
            <div class="st-sk st-sk--film" style="margin-top: 0"></div>
          </div>
        </div>
        <div class="st-skel-room" aria-hidden="true">
          <div class="st-skel-room__bar">
            <div class="st-sk" style="width: 32px; height: 32px; border-radius: 12px"></div>
            <div>
              <div class="st-sk" style="width: 96px; height: 12px; border-radius: 999px"></div>
              <div class="st-sk" style="width: 64px; height: 8px; margin-top: 6px; border-radius: 999px"></div>
            </div>
          </div>
          <div class="st-skel-room__list">
            <div class="st-sk" style="width: 58%; height: 40px; border-radius: 16px"></div>
            <div class="st-sk" style="width: 46%; height: 48px; border-radius: 16px; align-self: flex-end"></div>
            <div class="st-sk" style="width: 38%; height: 40px; border-radius: 16px"></div>
          </div>
          <div class="st-skel-room__composer">
            <div class="st-sk" style="width: 44px; height: 44px; border-radius: 999px"></div>
            <div class="st-sk" style="flex: 1; height: 44px; border-radius: 24px"></div>
            <div class="st-sk" style="width: 44px; height: 44px; border-radius: 999px"></div>
          </div>
        </div>
      </div>

      <!-- Crawlable product copy, for crawlers and no-JS visitors only. The
           app replaces this whole block on boot. -->
      <noscript>
        <style>
          .st-ns-head { max-width: 720px; margin: 0 auto; padding: 20px 24px 8px;
            font-family: var(--st-font-sans); }
          .st-ns-head a { display: inline-flex; align-items: center; gap: 8px;
            color: #1d1d1f; text-decoration: none; font-size: 19px; font-weight: 650;
            letter-spacing: -0.035em; }
          .st-ns-head img { width: 28px; height: 28px; display: block; }
          .st-ns { max-width: 720px; margin: 0 auto; padding: 0 24px 48px;
            font-family: var(--st-font-sans);
            color: #1d1d1f; background: #fbfbfd; }
          .st-ns h1 { font-size: 34px; line-height: 1.1; letter-spacing: -0.03em; margin: 0 0 12px; }
          .st-ns h2 { font-size: 15px; font-weight: 600; letter-spacing: 0.04em;
            text-transform: uppercase; color: #6e6e73; margin: 32px 0 10px; }
          .st-ns h3 { font-size: 15px; font-weight: 600; margin: 16px 0 4px; }
          .st-ns p, .st-ns li { font-size: 15px; line-height: 1.65; color: #3d3d3d; }
          .st-ns p { margin: 0 0 10px; }
          .st-ns a { color: #c04b09; }
        </style>
        <!-- Landmarks live here so the pre-hydration document is still an
             outline (header + main + one H1) for crawlers and no-JS
             readers, while the visible boot screen stays a loader. -->
        <header class="st-ns-head">
          <a href="/"><img src="/brand/logo-glyph-orange.webp" alt="" aria-hidden="true" />ShareTexts</a>
        </header>
        <main class="st-ns">
          <h1>Move anything between your devices.</h1>
          <p>ShareTexts sends text, links, photos, videos, and files directly between any two
            devices — phone to PC, iPhone to Windows — straight from your browser. No app, no
            account, no cable.</p>
          <h2>How ShareTexts works</h2>
          <ol>
            <li><strong>Open</strong> sharetexts.online on both devices — in the browser. Nothing to install.</li>
            <li><strong>Find your other device.</strong> On the device you want to send to, turn on Nearby for 10 minutes — it then appears on devices on the same network. Or connect with a six-digit code, a QR code, or a share link.</li>
            <li><strong>Connect with one tap.</strong> The connection is encrypted in transit.</li>
            <li><strong>Send anything</strong> — text, links, photos, videos, audio, any file. It moves directly between the two devices.</li>
            <li><strong>Receive it on the other device</strong> — then close the room. Copies you save remain on your device.</li>
          </ol>
          <h2>Frequently asked questions</h2>
          <h3>What is ShareTexts?</h3>
          <p>ShareTexts is a temporary bridge between two devices. Move text, links, photos, videos, and files directly from one screen to another. No app, no account. Live rooms for handoffs; Temporary Spaces store content for later. Saved items stay in your browser.</p>
          <h3>Do I need to install an app or create an account?</h3>
          <p>No. ShareTexts runs in the browser — no app, no account, nothing to install. It works between an iPhone and a Windows PC, or any two devices with a modern browser.</p>
          <h3>What can I send?</h3>
          <p>Text, links, photos, videos, audio, documents — any file type, transferred as the original bytes. Transfers are encrypted in transit. Live-room content is not stored server-side. Temporary Spaces store text and links until closed or expired; saved items stay in your browser.</p>
          <h3>How do devices find each other?</h3>
          <p>Four ways: Nearby (turn it on, on the device you want to send to, for 10 minutes — it then appears on devices on the same network), a six-digit code, a QR code, or a share link. The code, QR, and link work over any internet connection.</p>
          <h3>Is device discovery private?</h3>
          <p>Yes. Your device appears only when you turn Nearby on, for 10 minutes at a time, and only to devices on the same network. Those devices see a coarse label like “iPhone · Safari” — never your IP, accounts, or any permanent identifier.</p>
          <h3>Is ShareTexts private?</h3>
          <p>Live rooms encrypt transfers in transit, using a direct connection when available or an encrypted relay. The service issues room secrets; this is not a zero-knowledge system. Temporary Spaces store content until closed or expired; saved items stay in your browser.</p>
          <h3>What happens if my internet drops mid-transfer?</h3>
          <p>ShareTexts tells you whether the transfer can be retried. For large files, a stable connection is recommended.</p>
          <h3>Can I use ShareTexts between an iPhone and an Android phone?</h3>
          <p>Yes. ShareTexts works between any two devices with a modern browser — iPhone to Android, Android to Windows, iPhone to Mac.</p>
          <h3>What is a Temporary Space?</h3>
          <p>A Temporary Space is a shared shelf that lives for a set time — 6 hours up to 7 days. You create it, get an 8-character space code, and share that code instead of files. Anyone with the code can add text and links, and everyone in the space sees them. When the time is up, the space closes and the content is deleted.</p>
          <h3>How do I join a Temporary Space with a code?</h3>
          <p>Open sharetexts.online/space/join, enter the 8-character code the creator gave you, and tap Join space. You can also paste a full space link — it carries the same access. Both the code and the link stop working when the space closes.</p>
          <h2>More</h2>
          <p><a href="/docs">Docs</a> · <a href="/guides">Guides</a> · <a href="/about">About</a> ·
            <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> ·
            <a href="https://x.com/0xalyt" rel="noopener">x.com/0xalyt</a></p>
        </main>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
