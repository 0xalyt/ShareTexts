<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary -->
    <title>AirDrop for everyone — ShareTexts</title>
    <meta name="description" content="Share files between devices and send text from phone to PC or Mac — no app, no account. Open ShareTexts in both browsers, connect, send. Nothing is stored." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="ShareTexts" />
    <meta name="application-name" content="ShareTexts" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)" />

    <!-- First-paint canvas: the app's CSS arrives via JS (Vite injects it),
         so until main.tsx runs the browser paints with UA defaults — which
         framed the cream boot shell in an 8px WHITE border (default body
         margin on a white canvas). Pin the page field here, in head, so the
         very first painted pixel is already the app's canvas, light or dark. -->
    <style>
      html, body { margin: 0; background: #fbfbfd; }
      html.dark, html.dark body { background: #181818; }
    </style>

    <!-- No hero image preload any more: the landing hero is the live device
         demo, which is DOM, not a file. Preloading the retired composition
         image spent the first bytes of the connection on something the first
         screen no longer asks for. -->
    <!-- No webfont preload: the type system is the platform's own UI face
         (SF on Apple, Segoe on Windows — see --font-sans/--font-display in
         index.css). There is no font file to fetch, so a preload would only
         spend bytes on nothing and trip a "preloaded but not used" warning. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShareTexts" />

    <!-- Open Graph — every social surface reads THIS block (X, WhatsApp,
         LinkedIn, Slack, Discord, iMessage, Telegram). Title and image are
         the brand line and a designed card, not a bare icon on white: the
         old artwork read as an empty rectangle at card size, which is why
         shared links looked broken.
         ?v=22 + a NEW file name bust the caches: platforms key the preview
         on the URL, so the same path would keep serving the retired card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShareTexts" />
    <meta property="og:title" content="AirDrop for everyone — ShareTexts" />
    <meta property="og:description" content="Send text, photos, and files between any two devices. No app. No account. No wires. Free, in the browser." />
    <meta property="og:url" content="https://sharetexts.online/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://sharetexts.online/og/sharetext-og-v11.png?v=22" />
    <meta property="og:image:secure_url" content="https://sharetexts.online/og/sharetext-og-v11.png?v=22" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="ShareTexts — AirDrop for everyone. A room with a six-digit code, a laptop and a phone, and the ShareTexts lockup on a warm cream card." />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@0xalyt" />
    <meta name="twitter:creator" content="@0xalyt" />
    <meta name="twitter:title" content="AirDrop for everyone — ShareTexts" />
    <meta name="twitter:description" content="Send text, photos, and files between any two devices. No app. No account. No wires. Free, in the browser." />
    <meta name="twitter:image" content="https://sharetexts.online/og/sharetext-og-v11.png?v=22" />
    <meta name="twitter:image:src" content="https://sharetexts.online/og/sharetext-og-v11.png?v=22" />
    <meta name="twitter:image:alt" content="ShareTexts — AirDrop for everyone. A room with a six-digit code, a laptop and a phone, and the ShareTexts lockup on a warm cream card." />

    <link rel="canonical" href="https://sharetexts.online/" />
    <link rel="alternate" hreflang="x-default" href="https://sharetexts.online/" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <!-- /favicon.ico FIRST: crawlers, bookmark bars and OS shortcuts probe
         this URL by default; a 404 here is the usual reason a site's icon
         never appears in search results. Generated from the same artwork by
         scripts/gen-favicon-ico.mjs, so it can never drift from the PNGs. -->
    <link rel="icon" href="/favicon.ico?v=22" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=21" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=21" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=21" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=21" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=21" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=21" />

    <!-- Structured data: Organization + WebApplication graph. One graph,
         stable @ids; HowTo/FAQPage JSON-LD lives only on pages whose visible
         content actually matches it (/docs serves the FAQ both pre- and
         post-hydration; Google retired HowTo rich results in 2023, so no
         HowTo block is shipped where its steps can't stay visible). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://sharetexts.online/#organization",
          "name": "ShareTexts",
          "url": "https://sharetexts.online/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://sharetexts.online/icon-512.png?v=21",
            "width": 512,
            "height": 512
          },
          "sameAs": [
            "https://x.com/0xalyt",
            "https://github.com/0xalyt/ShareTexts"
          ]
        },
        {
          "@type": "WebApplication",
          "@id": "https://sharetexts.online/#application",
          "name": "ShareTexts",
          "alternateName": "ShareTexts",
          "url": "https://sharetexts.online/",
          "description": "Move text, links, photos, and files between any two devices. No app, no account. Pair, send, done. Rooms keep nothing after they close.",
          "applicationCategory": "UtilitiesApplication",
          "operatingSystem": "Any modern browser with WebRTC support",
          "browserRequirements": "Requires a supported browser and an internet connection",
          "isAccessibleForFree": true,
          "inLanguage": "en",
          "image": "https://sharetexts.online/og/sharetext-og-v11.png?v=22",
          "screenshot": "https://sharetexts.online/og/sharetext-og-v11.png?v=22",
          "featureList": [
            "Device discovery while ShareTexts is open on your other device",
            "Six-digit live pairing code",
            "QR code pairing",
            "Shareable room links",
            "Transfer text, links, photos, videos, audio, and any file",
            "Encrypted peer-to-peer transfers",
            "Works between iPhone, Android, Windows, macOS, and Linux"
          ],
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "publisher": {
            "@id": "https://sharetexts.online/#organization"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://sharetexts.online/#website",
          "url": "https://sharetexts.online/",
          "name": "ShareTexts",
          "publisher": { "@id": "https://sharetexts.online/#organization" },
          "inLanguage": "en"
        }
      ]
    }
    </script>
    <!-- Apply the saved theme before first paint (no flash): default to the
         system preference; a manual choice in localStorage wins. The same
         logic lives in src/lib/theme.ts for runtime changes. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('sharetext.theme');
          var dark = v === 'dark' || (v !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? '#181818' : '#fbfbfd';
        } catch (e) { /* storage unavailable — system default applies */ }
        // Slow-boot honesty (mirrors the in-app connecting screen): an 8s boot
        // is NOT normal — say so instead of shimmering forever. Folded into
        // this whitelisted script so the strict CSP keeps exactly ONE inline
        // script (the old second inline block violated script-src by hash).
        try {
          setTimeout(function () {
            var el = document.getElementById('st-boot-slow');
            if (el && document.getElementById('loading-shell')) el.style.display = 'block';
          }, 8000);
        } catch (e) { /* never block boot */ }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Boot screen: ONE quiet mark, one hairline progress, one line of
           text — the product holding your place while its code arrives.
           The old shell drew a full faux landing page (headline, fake Send
           buttons, a how-it-works list and ten FAQ answers) as grey bars, so
           the first thing anyone saw was a wireframe of a website: slop.
           A loader's only job is to say "coming, and it's ShareTexts".
           The crawlable copy did not disappear with it — it moved into the
           <noscript> block below, where it serves crawlers and no-JS
           visitors without ever being shown to a browser that can run the
           app. -->
      <div id="loading-shell">
        <style>
          #loading-shell {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fbfbfd;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            transition: opacity 0.22s cubic-bezier(0.22, 1, 0.36, 1);
          }
          #loading-shell.fade-out { opacity: 0; }
          html.dark #loading-shell { background: #181818; }
          #loading-shell .st-boot {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 24px;
            animation: st-boot-in 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
          }
          @keyframes st-boot-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
          #loading-shell .st-boot-brand {
            display: flex; align-items: center; gap: 9px;
          }
          #loading-shell .st-boot-brand img { display: block; width: 32px; height: 32px; }
          #loading-shell .st-boot-brand span {
            font-size: 23px; font-weight: 650; letter-spacing: -0.035em; color: #1d1d1f;
          }
          html.dark #loading-shell .st-boot-brand span { color: #e4e4e4; }
          /* One hairline bar: a warm run travels left to right inside a 2px
             track. No shimmer sweeps across the page, no layout of fake
             content — a progress indicator, not a mock site. */
          #loading-shell .st-track {
            position: relative; width: 132px; height: 2px; overflow: hidden;
            border-radius: 999px; background: rgba(0, 0, 0, 0.08);
          }
          html.dark #loading-shell .st-track { background: rgba(255, 255, 255, 0.12); }
          #loading-shell .st-track::after {
            content: ''; position: absolute; top: 0; bottom: 0; width: 45%;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(254, 171, 48, 0.5), #f06413);
            animation: st-run 1.25s cubic-bezier(0.5, 0, 0.5, 1) infinite;
          }
          @keyframes st-run {
            0% { transform: translateX(-110%); }
            100% { transform: translateX(320%); }
          }
          #loading-shell .st-note {
            margin: 0; font-size: 13px; font-weight: 500; line-height: 1.5;
            color: #6e6e73; letter-spacing: -0.01em;
          }
          html.dark #loading-shell .st-note { color: rgba(255, 255, 255, 0.55); }
          @media (prefers-reduced-motion: reduce) {
            #loading-shell .st-boot { animation: none; }
            #loading-shell .st-track::after { animation: none; width: 40%; transform: none; }
          }
          #st-boot-slow {
            margin: 0; max-width: 34ch; text-align: center;
            font-size: 12.5px; font-weight: 500; line-height: 1.5; color: #6e6e73;
          }
        </style>

        <div class="st-boot">
          <div class="st-boot-brand">
            <img src="/brand/logo-glyph-orange.png" alt="" aria-hidden="true" />
            <span>ShareTexts</span>
          </div>
          <div class="st-track" aria-hidden="true"></div>
          <p class="st-note">Opening ShareTexts…</p>
          <!-- The honest escalation (mirrors the in-app connecting screen): an
               8s boot is NOT normal — say so instead of animating forever. -->
          <p id="st-boot-slow" style="display:none">
            Still loading — your connection is slow. If this doesn't clear, check your network and refresh.
          </p>
        </div>
      </div>

      <!-- Crawlable product copy, for crawlers and no-JS visitors only. The
           app replaces this whole block on boot. -->
      <noscript>
        <style>
          .st-ns-head { max-width: 720px; margin: 0 auto; padding: 20px 24px 8px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
          .st-ns-head a { display: inline-flex; align-items: center; gap: 8px;
            color: #1d1d1f; text-decoration: none; font-size: 19px; font-weight: 650;
            letter-spacing: -0.035em; }
          .st-ns-head img { width: 28px; height: 28px; display: block; }
          .st-ns { max-width: 720px; margin: 0 auto; padding: 0 24px 48px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            color: #1d1d1f; background: #fbfbfd; }
          .st-ns h1 { font-size: 34px; line-height: 1.1; letter-spacing: -0.03em; margin: 0 0 12px; }
          .st-ns h2 { font-size: 15px; font-weight: 600; letter-spacing: 0.04em;
            text-transform: uppercase; color: #6e6e73; margin: 32px 0 10px; }
          .st-ns h3 { font-size: 15px; font-weight: 600; margin: 16px 0 4px; }
          .st-ns p, .st-ns li { font-size: 15px; line-height: 1.65; color: #3d3d3d; }
          .st-ns p { margin: 0 0 10px; }
          .st-ns a { color: #c04b09; }
        </style>
        <!-- Landmarks live here so the pre-hydration document is still an
             outline (header + main + one H1) for crawlers and no-JS
             readers, while the visible boot screen stays a loader. -->
        <header class="st-ns-head">
          <a href="/"><img src="/brand/logo-glyph-orange.png" alt="" aria-hidden="true" />ShareTexts</a>
        </header>
        <main class="st-ns">
          <h1>Move anything between your devices.</h1>
          <p>ShareTexts sends text, links, photos, videos, and files directly between any two
            devices — phone to PC, iPhone to Windows — straight from your browser. No app, no
            account, no cable.</p>
          <h2>How ShareTexts works</h2>
          <ol>
            <li><strong>Open</strong> sharetexts.online on both devices — in the browser. Nothing to install.</li>
            <li><strong>Find your other device.</strong> It appears under Available while ShareTexts is open on both devices; otherwise connect with a six-digit code, a QR code, or a share link.</li>
            <li><strong>Connect with one tap.</strong> The connection is encrypted in transit.</li>
            <li><strong>Send anything</strong> — text, links, photos, videos, audio, any file. It moves directly between the two devices.</li>
            <li><strong>Receive it on the other device</strong> — then close the room. Nothing is kept.</li>
          </ol>
          <h2>Frequently asked questions</h2>
          <h3>What is ShareTexts?</h3>
          <p>ShareTexts is a temporary bridge between two devices. Move text, links, photos, videos, and files directly from one screen to another. No app, no account, nothing kept.</p>
          <h3>Do I need to install an app or create an account?</h3>
          <p>No. ShareTexts runs in the browser — no app, no account, nothing to install. It works between an iPhone and a Windows PC, or any two devices with a modern browser.</p>
          <h3>What can I send?</h3>
          <p>Text, links, photos, videos, audio, documents — any file type, transferred as the original bytes. Transfers are encrypted in transit. Rooms store nothing after they close.</p>
          <h3>How do devices find each other?</h3>
          <p>Four ways: device discovery (the other device appears automatically while ShareTexts is open on both), a six-digit code, a QR code, or a share link. The code, QR, and link work over any internet connection.</p>
          <h3>Is device discovery private?</h3>
          <p>Yes. Your device appears only while ShareTexts is open on it, and other devices see a temporary label like “Windows PC” — never your IP, accounts, or any permanent identifier.</p>
          <h3>Is ShareTexts private?</h3>
          <p>Transfers are encrypted in transit. ShareTexts keeps no account and no permanent history. Rooms close automatically and keep nothing. A Temporary Space stores its content only until it expires, then that content is deleted.</p>
          <h3>What happens if my internet drops mid-transfer?</h3>
          <p>ShareTexts tells you whether the transfer can be retried. For large files, a stable connection is recommended.</p>
          <h3>Can I use ShareTexts between an iPhone and an Android phone?</h3>
          <p>Yes. ShareTexts works between any two devices with a modern browser — iPhone to Android, Android to Windows, iPhone to Mac.</p>
          <h3>What is a Temporary Space?</h3>
          <p>A Temporary Space is a shared shelf that lives for a set time — 6 hours up to 7 days. You create it, get an 8-character space code, and share that code instead of files. Anyone with the code can add text, links, photos, or files, and everyone in the space sees them. When the time is up, the space closes and the content is deleted.</p>
          <h3>How do I join a Temporary Space with a code?</h3>
          <p>Open sharetexts.online/space/join, enter the 8-character code the creator gave you, and tap Join space. You can also paste a full space link — it carries the same access. Both the code and the link stop working when the space closes.</p>
          <h2>More</h2>
          <p><a href="/docs">Docs</a> · <a href="/guides">Guides</a> · <a href="/about">About</a> ·
            <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> ·
            <a href="https://x.com/0xalyt" rel="noopener">x.com/0xalyt</a> ·
            <a href="https://github.com/0xalyt/ShareTexts" rel="noopener">GitHub</a></p>
        </main>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
